services:
  mongodb:
    image: mongo:8.0
    container_name: medilink-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - medilink_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  replica-set-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -lc
      - >-
        mongosh --host mongodb:27017 --eval
        'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }'

volumes:
  medilink_mongo_data:
